name: Publish Docker Image on Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      build: ${{ steps.release_meta.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve release metadata
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ "$VERSION" = "$TAG" ] || [ -z "$VERSION" ]; then
            echo "Expected tag format v<version>, got: ${TAG}"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected SemVer tag format vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD], got: ${TAG}"
            exit 1
          fi

          REPO_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)"
          if [ -z "$REPO_VERSION" ]; then
            echo "Failed to resolve <Version> from Directory.Build.props"
            exit 1
          fi

          if [ "$REPO_VERSION" != "$VERSION" ]; then
            echo "Tag version (${VERSION}) does not match Directory.Build.props version (${REPO_VERSION})."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=tag-${VERSION}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Tagged SHA
    needs: preflight
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml

  npm-audit:
    name: Check npm publication policy
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/npm-publication-gate.yml

  build-platform:
    name: Build and Smoke Test (${{ matrix.platform }})
    needs:
      - preflight
      - validate
      - npm-audit
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build release candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: boardoil:release-candidate-${{ matrix.architecture }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BO_VERSION=${{ needs.preflight.outputs.version }}
            BO_CHANNEL=release
            BO_BUILD=${{ needs.preflight.outputs.build }}
            BO_COMMIT=${{ github.sha }}

      - name: Smoke test release candidate
        env:
          EXPECTED_BUILD: ${{ needs.preflight.outputs.build }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          IMAGE: boardoil:release-candidate-${{ matrix.architecture }}
        run: |
          set -euo pipefail

          CONTAINER_NAME="boardoil-release-smoke-${{ matrix.architecture }}"

          cleanup() {
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1::5000 \
            "$IMAGE"

          HOST_PORT="$(docker port "$CONTAINER_NAME" 5000/tcp | sed -n 's/.*://p')"
          HEALTH_URL="http://127.0.0.1:${HOST_PORT}/api/health"
          VERSION_URL="http://127.0.0.1:${HOST_PORT}/api/version"

          HEALTH_JSON=""
          for _ in {1..30}; do
            if HEALTH_JSON="$(curl --fail --silent "$HEALTH_URL" 2>/dev/null)"; then
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Release candidate stopped before becoming healthy."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          if [ -z "$HEALTH_JSON" ]; then
            echo "Release candidate did not become healthy within 60 seconds."
            docker logs "$CONTAINER_NAME"
            exit 1
          fi

          jq --exit-status \
            '.success == true and .data.status == "ok"' \
            <<< "$HEALTH_JSON"

          VERSION_JSON="$(curl --fail --silent --show-error "$VERSION_URL")"
          jq --exit-status \
            --arg version "$EXPECTED_VERSION" \
            --arg build "$EXPECTED_BUILD" \
            --arg commit "$EXPECTED_COMMIT" \
            '.success == true
              and .data.version == $version
              and .data.channel == "release"
              and .data.build == $build
              and .data.commit == $commit' \
            <<< "$VERSION_JSON"

      - name: Push smoke-tested platform image by digest
        id: release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.image.outputs.ghcr_name }},${{ steps.image.outputs.dockerhub_name }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BO_VERSION=${{ needs.preflight.outputs.version }}
            BO_CHANNEL=release
            BO_BUILD=${{ needs.preflight.outputs.build }}
            BO_COMMIT=${{ github.sha }}

      - name: Export platform digest
        run: |
          mkdir -p "$RUNNER_TEMP/release-digests"
          digest="${{ steps.release.outputs.digest }}"
          touch "$RUNNER_TEMP/release-digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/release-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-Architecture Release Manifests
    needs:
      - preflight
      - validate
      - build-platform
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04

    steps:
      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-digests-*
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true

      - name: Create and verify release manifests
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub_name }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          digest_files=("$RUNNER_TEMP"/release-digests/*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#digest_files[@]}."
            exit 1
          fi

          digests=()
          for digest_file in "${digest_files[@]}"; do
            digest_name="$(basename "$digest_file")"
            if ! [[ "$digest_name" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid platform digest artifact: ${digest_name}"
              exit 1
            fi
            digests+=("sha256:${digest_name}")
          done

          publish_manifest() {
            local image="$1"
            local sources=()
            local tag_args=()
            local tags=()

            mapfile -t tags < <(
              jq -r --arg image "$image" \
                '.tags[] | select(startswith($image + ":"))' \
                <<< "$METADATA_JSON"
            )

            if [ "${#tags[@]}" -eq 0 ]; then
              echo "No generated tags found for ${image}."
              exit 1
            fi

            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done
            for digest in "${digests[@]}"; do
              sources+=("${image}@${digest}")
            done

            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

            raw_manifest="$(docker buildx imagetools inspect --raw "${tags[0]}")"
            jq --exit-status '
              [.manifests[].platform
                | select(.os == "linux")
                | .architecture] as $architectures
              | ($architectures | index("amd64") != null)
                and ($architectures | index("arm64") != null)
            ' <<< "$raw_manifest"
          }

          publish_manifest "$GHCR_IMAGE"
          publish_manifest "$DOCKERHUB_IMAGE"
