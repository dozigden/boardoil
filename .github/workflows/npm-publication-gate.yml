name: Npm Publication Gate

on:
  workflow_call:
    inputs:
      allow_temporary_picomatch_exception:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked npm dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: BoardOil.Web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pinned npm
        run: |
          BOARDOIL_NPM_VERSION="$(node -p "require('./package.json').engines.npm")"
          npm install --global --ignore-scripts "npm@$BOARDOIL_NPM_VERSION"

      - name: Block publication for high or critical npm vulnerabilities
        if: ${{ !inputs.allow_temporary_picomatch_exception }}
        run: npm audit --package-lock-only --include=dev --include=optional --include=peer --audit-level=high

      - name: Audit with the temporary nightly picomatch exception
        if: inputs.allow_temporary_picomatch_exception
        run: node ../.github/scripts/audit-nightly-npm.mjs
