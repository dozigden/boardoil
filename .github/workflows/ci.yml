name: CI

on:
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore BoardOil.slnx --locked-mode -maxcpucount:1 -nodeReuse:false

      - name: Build
        run: dotnet build BoardOil.slnx --configuration Release --no-restore -maxcpucount:1 -nodeReuse:false

      - name: Prepare test results directory
        run: mkdir -p TestResults

      - name: Test API
        run: dotnet BoardOil.Api.Tests/bin/Release/net10.0/BoardOil.Api.Tests.dll --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename BoardOil.Api.Tests.trx

      - name: Test Services
        if: always()
        run: dotnet BoardOil.Services.Tests/bin/Release/net10.0/BoardOil.Services.Tests.dll --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename BoardOil.Services.Tests.trx

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BoardOil.Web

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BoardOil.Web/package-lock.json

      - name: Setup pinned npm
        run: |
          BOARDOIL_NPM_VERSION="$(node -p "require('./package.json').engines.npm")"
          npm install --global --ignore-scripts "npm@$BOARDOIL_NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET (NuGet licence sources)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore NuGet packages for licence sync
        run: dotnet restore ../BoardOil.Api/BoardOil.Api.csproj --locked-mode -maxcpucount:1 -nodeReuse:false

      - name: Verify third-party licence sync
        run: |
          npm run sync:third-party-licences -- --strict
          if [ -n "$(git status --porcelain -- THIRD_PARTY_LICENSES public/third-party-licenses)" ]; then
            echo "Third-party licence files are out of date. Run: npm run sync:third-party-licences"
            git status --short -- THIRD_PARTY_LICENSES public/third-party-licenses
            exit 1
          fi

      - name: Verify frontend release gate
        run: npm run verify-release

  browser-smoke:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BoardOil.Web

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BoardOil.Web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Setup pinned npm
        run: |
          BOARDOIL_NPM_VERSION="$(node -p "require('./package.json').engines.npm")"
          npm install --global --ignore-scripts "npm@$BOARDOIL_NPM_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e:smoke

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure
          path: BoardOil.Web/test-results/playwright
          if-no-files-found: ignore
          retention-days: 3
