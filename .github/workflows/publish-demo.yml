name: Publish Static Demo

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: demo-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.demo_artifact.outputs.artifact-id }}

    defaults:
      run:
        working-directory: source/BoardOil.Web

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/BoardOil.Web/package-lock.json

      - name: Setup .NET for licence sources
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: source/**/packages.lock.json

      - name: Restore NuGet packages for licence sync
        run: dotnet restore ../BoardOil.Api/BoardOil.Api.csproj --locked-mode -maxcpucount:1 -nodeReuse:false

      - name: Setup pinned npm
        run: |
          BOARDOIL_NPM_VERSION="$(node -p "require('./package.json').engines.npm")"
          npm install --global --ignore-scripts "npm@$BOARDOIL_NPM_VERSION"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify third-party licence sync
        run: |
          npm run sync:third-party-licences -- --strict
          if [ -n "$(git status --porcelain -- THIRD_PARTY_LICENSES public/third-party-licenses)" ]; then
            echo "Third-party licence files are out of date. Run: npm run sync:third-party-licences"
            git status --short -- THIRD_PARTY_LICENSES public/third-party-licenses
            exit 1
          fi

      - name: Check frontend
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and smoke test the demo artifact
        env:
          BOARDOIL_DEMO_SOURCE_SHA: ${{ github.sha }}
        run: npm run test:demo:smoke

      - name: Upload validated demo
        id: demo_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-${{ github.sha }}-${{ github.run_attempt }}
          path: source/BoardOil.Web/dist-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Validated Demo
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: demo-production

    steps:
      - name: Download validated demo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: demo-artifact

      - name: Validate publication contents
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path("demo-artifact")
          forbidden = {".git", ".github", ".gitmodules", ".gitattributes"}
          for entry in artifact.rglob("*"):
              if entry.is_symlink():
                  raise SystemExit(f"Symlink in demo artifact: {entry}")
              if entry.name.casefold() in forbidden:
                  raise SystemExit(f"Git control path in demo artifact: {entry}")
              if not entry.is_file() and not entry.is_dir():
                  raise SystemExit(f"Non-regular entry in demo artifact: {entry}")

          if not (artifact / "index.html").is_file():
              raise SystemExit("Demo artifact is missing index.html")
          deployment = json.loads((artifact / "deployment.json").read_text())
          expected = {
              "artifact": "static-demo",
              "sourceRepository": "https://github.com/dozigden/boardoil",
              "sourceCommit": os.environ["SOURCE_SHA"],
          }
          if deployment != expected:
              raise SystemExit("Demo artifact does not match the workflow source commit")
          PY

      - name: Checkout distribution repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dozigden/boardoil-demo-dist
          ref: main
          ssh-key: ${{ secrets.DEMO_DIST_DEPLOY_KEY }}
          path: distribution

      - name: Replace distribution contents
        working-directory: .
        run: |
          git -C distribution rm -r --ignore-unmatch .
          cp -a demo-artifact/. distribution/
          git -C distribution add --all --force

      - name: Commit and push changed artifact
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git -C distribution diff --cached --quiet; then
            echo "The published artifact is already current."
            exit 0
          fi

          git -C distribution config user.name "github-actions[bot]"
          git -C distribution config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C distribution commit -m "Publish demo from dozigden/boardoil@${SOURCE_SHA}"
          git -C distribution push origin main

          DISTRIBUTION_SHA="$(git -C distribution rev-parse HEAD)"
          echo "Published source ${SOURCE_SHA} as distribution commit ${DISTRIBUTION_SHA}." >> "$GITHUB_STEP_SUMMARY"
