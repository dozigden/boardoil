services:
  boardoil:
    image: dozigden/boardoil:latest
    container_name: boardoil
    ports:
      - "5000:5000"
    environment:
      BoardOilAuth__AllowInsecureCookies: "true"
    volumes:
      # BoardOil generates and persists its signing key in this data folder.
      - ./boardoil-data:/data
    restart: unless-stopped
